<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy CRM — Welcome Email Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:0;
    font-family:'Sarabun','Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(1100px 480px at 12% -10%, rgba(43,124,246,0.10), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(43,124,246,0.06), transparent 55%),
      #EEF1F6;
    color:#1A1A1A;
    min-height:100vh;
  }

  /* Top bar */
  .topbar {
    background:#FFFFFF;
    border-bottom:1px solid #E7EAF0;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
  }
  .topbar-inner {
    max-width:1200px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .topbar img { width:32px; height:32px; display:block; }
  .topbar-title { font-size:15px; font-weight:700; color:#1A1A1A; line-height:1.2; }
  .topbar-title span { display:block; font-size:11px; font-weight:600; color:#8A93A3; letter-spacing:0.3px; text-transform:uppercase; margin-top:1px; }
  .topbar-badge {
    margin-left:auto;
    font-size:11px;
    font-weight:700;
    color:#2B7CF6;
    background:#EAF1FE;
    padding:5px 10px;
    border-radius:999px;
    letter-spacing:0.2px;
  }
  .tool-select {
    margin-left:auto;
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    color:#2B7CF6;
    background:#EAF1FE;
    border:1.5px solid #D7E6FD;
    padding:8px 34px 8px 14px;
    border-radius:999px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B7CF6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:14px;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .tool-select:hover { background-color:#DCE9FE; }
  .tool-select:focus { outline:none; border-color:#2B7CF6; box-shadow:0 0 0 4px rgba(43,124,246,0.12); }

  .tool-section { display:none; }
  .tool-section.active { display:block; }

  .empty-state {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:64px 24px;
    color:#98A2B3;
  }
  .empty-state-icon {
    width:56px;
    height:56px;
    border-radius:50%;
    background:#F3F5F8;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#B0B8C4;
    margin-bottom:16px;
  }
  .empty-state-title {
    font-size:15px;
    font-weight:800;
    color:#3A4150;
    margin:0 0 6px 0;
  }
  .empty-state-sub {
    font-size:13px;
    color:#98A2B3;
    margin:0;
    max-width:360px;
    line-height:1.6;
  }

  .wrap { max-width:1200px; margin:0 auto; padding:28px 20px 64px; }
  h1 { font-size:22px; margin:0 0 22px 0; font-weight:800; letter-spacing:-0.2px; }

  .grid {
    display:grid;
    grid-template-columns: 360px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background:#FFFFFF;
    border-radius:16px;
    padding:24px;
    border:1px solid #EAEDF2;
    box-shadow:0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.05);
  }
  .panel-heading {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:800;
    color:#2B7CF6;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:0 0 18px 0;
    padding-bottom:14px;
    border-bottom:1px solid #F0F2F6;
  }
  .panel-heading .dot { width:7px; height:7px; border-radius:50%; background:#2B7CF6; box-shadow:0 0 0 3px #EAF1FE; }

  .field { margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:700; color:#333; margin-bottom:7px; }
  input[type=text] {
    width:100%;
    padding:11px 13px;
    border:1.5px solid #E3E6EC;
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
    background:#FAFBFC;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  input[type=text]:hover { border-color:#CBD3E1; }
  input[type=text]:focus {
    outline:none;
    border-color:#2B7CF6;
    background:#FFFFFF;
    box-shadow:0 0 0 4px rgba(43,124,246,0.12);
  }
  .hint { font-size:11.5px; color:#98A2B3; margin-top:6px; line-height:1.5; }
  .hint b { color:#2B7CF6; }

  .btn {
    width:100%;
    padding:13px 16px;
    border:none;
    border-radius:9px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease, transform .05s ease, box-shadow .15s ease;
  }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:#2B7CF6; color:#fff; box-shadow:0 4px 12px rgba(43,124,246,0.28); }
  .btn-primary:hover { background:#1F63C4; }
  .btn-secondary { background:#F3F5F8; color:#3A4150; border:1.5px solid #E7EAF0; }
  .btn-secondary:hover { background:#EAEDF2; }
  .btn svg { flex:none; }

  .status {
    font-size:12.5px;
    margin-top:12px;
    min-height:18px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .preview-shell {
    background:transparent;
    border-radius:16px;
  }
  .preview-topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 2px 12px 2px;
  }
  .preview-label {
    font-size:12px;
    color:#8A93A3;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .live-dot {
    width:7px; height:7px; border-radius:50%;
    background:#1a8a4a;
    box-shadow:0 0 0 3px rgba(26,138,74,0.15);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:.45; }
  }
  .browser-chrome {
    background:#FFFFFF;
    border-radius:14px;
    border:1px solid #E7EAF0;
    box-shadow:0 1px 2px rgba(16,24,40,0.04), 0 12px 32px rgba(16,24,40,0.07);
    overflow:hidden;
  }
  .browser-chrome-bar {
    display:flex;
    align-items:center;
    gap:6px;
    padding:11px 14px;
    background:#F6F7F9;
    border-bottom:1px solid #ECEEF2;
  }
  .browser-chrome-bar .dot { width:9px; height:9px; border-radius:50%; }
  .browser-chrome-body { padding:18px; background:#F2F4F7; }

  /* Manual builder */
  .manual-grid { grid-template-columns: 280px 1fr; align-items:start; }
  @media (max-width: 860px) { .manual-grid { grid-template-columns: 1fr; } }

  .page-list { margin-bottom:14px; display:flex; flex-direction:column; gap:8px; }
  .page-item {
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:12px;
    cursor:pointer;
    background:#FFFFFF;
    border:1.5px solid #EAEDF2;
    transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .page-item:hover { border-color:#D7E6FD; box-shadow:0 2px 8px rgba(16,24,40,0.06); }
  .page-item.active { background:#F5F9FF; border-color:#2B7CF6; box-shadow:0 4px 14px rgba(43,124,246,0.16); }
  .page-thumb {
    width:34px; height:46px;
    flex:none;
    border-radius:4px;
    background:#FFFFFF;
    border:1px solid #E3E6EC;
    box-shadow:0 1px 3px rgba(16,24,40,0.10);
    overflow:hidden;
    position:relative;
  }
  .page-thumb-band { height:14px; background:linear-gradient(120deg,#2B7CF6,#6AA6FF); }
  .page-thumb.is-cover .page-thumb-band { height:100%; }
  .page-thumb-num {
    position:absolute; right:3px; bottom:2px;
    font-size:7px; font-weight:800; color:#AAB2C0;
  }
  .page-thumb.is-cover .page-thumb-num { color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.15); }
  .page-item-title {
    flex:1;
    font-size:12.5px;
    font-weight:700;
    color:#333;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .page-item-delete {
    width:18px; height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#B0B8C4;
    font-size:14px;
    line-height:1;
    flex:none;
  }
  .page-item-delete:hover { background:#FBE1E1; color:#C0392B; }

  .editor-panel {
    display:flex;
    flex-direction:column;
    align-items:center;
    background:linear-gradient(180deg,#E7ECF6 0%, #DCE4F1 100%);
    border-radius:18px;
    padding:28px 18px 36px;
    border:1px solid #E2E7F0;
  }
  .page-toolbar-wrap { width:100%; max-width:640px; margin-bottom:16px; }
  .toolbar {
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    background:#FFFFFF;
    border:1.5px solid #E7EAF0;
    border-radius:11px;
    padding:8px 10px;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
  }
  .toolbar button {
    border:1.5px solid #E7EAF0;
    background:#FAFBFC;
    color:#3A4150;
    font-size:12px;
    font-weight:700;
    font-family:inherit;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .toolbar button:hover { background:#F0F2F6; border-color:#D7DCE5; }
  .toolbar-sep { width:1px; height:20px; background:#EAEDF2; margin:0 4px; }

  /* The "page" itself — styled like a physical handbook page, fixed to A4 proportions */
  .page-card {
    width:100%;
    max-width:640px;
    aspect-ratio:1 / 1.4142;
    display:flex;
    flex-direction:column;
    background:#FFFFFF;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 4px rgba(16,24,40,0.08), 0 24px 48px -12px rgba(16,24,40,0.22);
    position:relative;
  }
  .page-card-header {
    flex:none;
    position:relative;
    background:linear-gradient(120deg,#2B7CF6 0%, #5FA3FF 100%);
    padding:24px 34px 26px 34px;
  }
  .page-card.is-cover .page-card-header { display:none; }
  .page-card.is-cover .editor { padding:0; }
  .page-card.is-cover .page-card-footer { display:none; }
  .page-num-badge {
    position:absolute;
    top:16px; right:18px;
    background:rgba(255,255,255,0.22);
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:5px 12px;
    border-radius:999px;
    letter-spacing:0.3px;
  }
  .page-card-header input.page-title-input {
    width:85%;
    border:none;
    border-radius:0;
    background:transparent;
    font-size:21px;
    font-weight:800;
    font-family:inherit;
    color:#FFFFFF;
    padding:4px 2px;
  }
  .page-card-header input.page-title-input::placeholder { color:rgba(255,255,255,0.75); }
  .page-card-header input.page-title-input:focus { outline:none; background:transparent; box-shadow:none; }
  .page-card-header input.page-title-input:hover { border-color:transparent; }

  .editor {
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:36px 40px 12px 40px;
    font-size:14.5px;
    line-height:1.85;
    color:#2A2E36;
    outline:none;
  }
  .editor h2 {
    font-size:18px; font-weight:800; margin:22px 0 10px 0; color:#1A1A1A;
    padding-left:12px; border-left:4px solid #2B7CF6;
  }
  .editor h2:first-child { margin-top:0; }
  .editor p { margin:0 0 14px 0; }
  .editor ul, .editor ol { margin:0 0 14px 0; padding-left:22px; }
  .editor li { margin-bottom:4px; }
  .editor img { max-width:100%; border-radius:8px; margin:14px 0; display:block; box-shadow:0 4px 14px rgba(16,24,40,0.10); }
  .editor:empty:before {
    content:attr(data-hint);
    color:#B0B8C4;
  }
  /* Inserted images: resizable (drag bottom-right corner) and draggable to reposition */
  .editor .img-wrap {
    display:inline-block;
    position:relative;
    overflow:hidden;
    resize:both;
    min-width:60px;
    min-height:60px;
    max-width:100%;
    vertical-align:top;
    margin:6px 4px;
    border-radius:8px;
    box-shadow:0 4px 14px rgba(16,24,40,0.10);
    cursor:move;
  }
  .editor .img-wrap:hover { outline:2px dashed #2B7CF6; outline-offset:2px; }
  .editor .img-wrap img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .page-card-footer {
    flex:none;
    text-align:center;
    padding:10px 0 24px;
    font-size:11px;
    font-weight:700;
    color:#C2C9D4;
    letter-spacing:0.3px;
  }
</style>
</head>

function currentValues() {
  return {
    name: document.getElementById('custName').value.trim(),
    subdomain: document.getElementById('subdomain').value.trim(),
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value.trim(),
  };
}

function render() {
  const v = currentValues();
  document.getElementById('emailContent').innerHTML = buildEmailHTML(v.name, v.subdomain, v.username, v.password);
  document.getElementById('status').textContent = '';
}

async function copyEmail() {
  const el = document.getElementById('emailContent');
  const htmlStr = el.innerHTML;
  const textStr = el.innerText;
  const statusEl = document.getElementById('status');

  try {
    const item = new ClipboardItem({
      'text/html': new Blob([htmlStr], {type: 'text/html'}),
      'text/plain': new Blob([textStr], {type: 'text/plain'})
    });
    await navigator.clipboard.write([item]);
    statusEl.style.color = '#1a8a4a';
    statusEl.textContent = '✓ คัดลอกแล้ว ไปวางในอีเมล (Cmd+V / Ctrl+V) ได้เลย';
    return;
  } catch (err) {
    // fallback: select the node and use execCommand
    try {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand('copy');
      sel.removeAllRanges();
      if (ok) {
        statusEl.style.color = '#1a8a4a';
        statusEl.textContent = '✓ คัดลอกแล้ว ไปวางในอีเมลได้เลย';
        return;
      }
      throw new Error('execCommand failed');
    } catch (err2) {
      statusEl.style.color = '#c0392b';
      statusEl.textContent = 'คัดลอกอัตโนมัติไม่สำเร็จ — ลองคลิกในกรอบตัวอย่างด้านขวา กด Cmd/Ctrl+A แล้ว Cmd/Ctrl+C แทน';
    }
  }
}

function downloadEmail() {
  const v = currentValues();
  const fullHtml = '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>Welcome Email</title></head><body style="margin:0;padding:0;">' + buildEmailHTML(v.name, v.subdomain, v.username, v.password) + '</body></html>';
  const blob = new Blob([fullHtml], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (v.subdomain || 'welcome_email').replace(/[^a-zA-Z0-9_-]/g, '');
  a.href = url;
  a.download = 'welcome_' + (safeName || 'email') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const DEFAULT_HINT = 'เริ่มพิมพ์เนื้อหาที่นี่... (แทรกรูปได้จากปุ่ม "แทรกรูป")';

let manualPages = [
  { id: 1, title: 'หน้าปก', html: '', hint: 'หน้าปกเป็นหน้าเปล่า แทรกรูปภาพหน้าปกสำเร็จรูปได้เลยจากปุ่ม "แทรกรูป" แล้วลากมุมเพื่อปรับขนาด หรือลากรูปเพื่อย้ายตำแหน่งได้' },
  { id: 2, title: 'เริ่มต้นใช้งาน', html: '', hint: 'ใส่ลิงก์หรือช่องทางเข้าใช้งานระบบ เช่น ลิงก์หน้าสมาชิก หรือ LINE OA ของร้าน' },
  { id: 3, title: 'ขั้นตอนที่ 1: สมัครสมาชิก', html: '', hint: 'อธิบายวิธีสมัครสมาชิกทีละขั้นตอน แนบภาพหน้าจอประกอบได้' },
  { id: 4, title: 'ขั้นตอนที่ 2: สะสมคะแนน', html: '', hint: 'อธิบายวิธีสะสมคะแนน เช่น การส่งสลิปเข้า LINE' },
  { id: 5, title: 'ขั้นตอนที่ 3: ตรวจสอบคะแนนสะสม', html: '', hint: 'อธิบายวิธีดูคะแนนสะสมและบัตรสมาชิกดิจิทัล' },
  { id: 6, title: 'ขั้นตอนที่ 4: ใช้คูปอง/สิทธิพิเศษ', html: '', hint: 'อธิบายวิธีใช้คูปองหรือสิทธิพิเศษของร้าน' },
  { id: 7, title: 'คำถามที่พบบ่อย (FAQ)', html: '', hint: 'ใส่คำถาม-คำตอบที่ลูกค้ามักถามบ่อย' },
  { id: 8, title: 'ช่องทางติดต่อ', html: '', hint: 'ใส่ช่องทางติดต่อร้าน เช่น LINE OA เบอร์โทร ที่อยู่' }
];
let activePageId = 1;
let nextPageId = 9;
let savedRange = null;

function findPage(id) {
  return manualPages.find(p => p.id === id);
}

function renderPageList() {
  const listEl = document.getElementById('pageList');
  listEl.innerHTML = '';
  manualPages.forEach((page, idx) => {
    const item = document.createElement('div');
    item.className = 'page-item' + (page.id === activePageId ? ' active' : '');
    item.onclick = () => selectPage(page.id);

    const thumb = document.createElement('span');
    thumb.className = 'page-thumb' + (idx === 0 ? ' is-cover' : '');
    const band = document.createElement('span');
    band.className = 'page-thumb-band';
    const num = document.createElement('span');
    num.className = 'page-thumb-num';
    num.textContent = idx + 1;
    thumb.appendChild(band);
    thumb.appendChild(num);

    const title = document.createElement('span');
    title.className = 'page-item-title';
    title.textContent = page.title || 'ไม่มีชื่อ';

    item.appendChild(thumb);
    item.appendChild(title);

    if (manualPages.length > 1) {
      const del = document.createElement('span');
      del.className = 'page-item-delete';
      del.innerHTML = '&times;';
      del.onclick = (e) => { e.stopPropagation(); deletePage(page.id); };
      item.appendChild(del);
    }

    listEl.appendChild(item);
  });
}

function updatePageNumBadge() {
  const idx = manualPages.findIndex(p => p.id === activePageId);
  const badge = document.getElementById('pageNumBadge');
  if (badge && idx > -1) badge.textContent = 'หน้า ' + (idx + 1) + '/' + manualPages.length;
  const cardEl = document.getElementById('pageCard');
  if (cardEl) cardEl.classList.toggle('is-cover', idx === 0);
}

function selectPage(id) {
  saveActivePageContent();
  activePageId = id;
  const page = findPage(id);
  document.getElementById('pageTitleInput').value = page.title;
  const editorEl = document.getElementById('editor');
  editorEl.innerHTML = page.html;
  editorEl.dataset.hint = page.hint || DEFAULT_HINT;
  renderPageList();
  updatePageNumBadge();
}

function addPage() {
  saveActivePageContent();
  const page = { id: nextPageId, title: 'หน้าที่ ' + nextPageId, html: '', hint: DEFAULT_HINT };
  nextPageId += 1;
  manualPages.push(page);
  selectPage(page.id);
}

function deletePage(id) {
  if (manualPages.length <= 1) return;
  const idx = manualPages.findIndex(p => p.id === id);
  manualPages = manualPages.filter(p => p.id !== id);
  if (activePageId === id) {
    const next = manualPages[Math.max(0, idx - 1)];
    activePageId = next.id;
    document.getElementById('pageTitleInput').value = next.title;
    const editorEl = document.getElementById('editor');
    editorEl.innerHTML = next.html;
    editorEl.dataset.hint = next.hint || DEFAULT_HINT;
  }
  renderPageList();
  updatePageNumBadge();
}

function updateActiveTitle(value) {
  const page = findPage(activePageId);
  if (page) {
    page.title = value;
    renderPageList();
  }
}

function saveActivePageContent() {
  const page = findPage(activePageId);
  if (page) {
    page.html = document.getElementById('editor').innerHTML;
  }
}

function execCmd(cmd, value) {
  document.getElementById('editor').focus();
  document.execCommand(cmd, false, value || null);
  saveActivePageContent();
}

function triggerImageUpload() {
  const editor = document.getElementById('editor');
  editor.focus();
  const sel = window.getSelection();
  savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;
  document.getElementById('imageInput').value = '';
  document.getElementById('imageInput').click();
}

function insertImageWrap(src, w, h) {
  const editor = document.getElementById('editor');
  editor.focus();
  const sel = window.getSelection();
  if (savedRange) {
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  const html = '<span class="img-wrap" contenteditable="false" draggable="true" style="width:' + w + 'px;height:' + h + 'px;"><img src="' + src + '" alt="" draggable="false"></span>&nbsp;';
  document.execCommand('insertHTML', false, html);
  saveActivePageContent();
}

function handleImageUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const probe = new Image();
    probe.onload = function () {
      const maxW = 420;
      let w = probe.naturalWidth || maxW;
      let h = probe.naturalHeight || Math.round(maxW * 0.7);
      if (w > maxW) {
        h = Math.round(h * (maxW / w));
        w = maxW;
      }
      insertImageWrap(e.target.result, w, h);
    };
    probe.onerror = function () {
      insertImageWrap(e.target.result, 320, 220);
    };
    probe.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Drag-to-reposition: images can be dragged and dropped anywhere within the page content
let draggedImgWrap = null;
function initImageDragMove() {
  const editor = document.getElementById('editor');
  editor.addEventListener('dragstart', function (e) {
    const wrap = e.target.closest && e.target.closest('.img-wrap');
    if (wrap) {
      draggedImgWrap = wrap;
      e.dataTransfer.effectAllowed = 'move';
    }
  });
  editor.addEventListener('dragover', function (e) {
    if (draggedImgWrap) e.preventDefault();
  });
  editor.addEventListener('drop', function (e) {
    if (!draggedImgWrap) return;
    e.preventDefault();
    let range = null;
    if (document.caretRangeFromPoint) {
      range = document.caretRangeFromPoint(e.clientX, e.clientY);
    } else if (document.caretPositionFromPoint) {
      const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
      if (pos) {
        range = document.createRange();
        range.setStart(pos.offsetNode, pos.offset);
        range.collapse(true);
      }
    }
    if (range) range.insertNode(draggedImgWrap);
    draggedImgWrap = null;
    saveActivePageContent();
  });
}

// Strip interactive-only attributes and inline the necessary display rules
// so inserted images still render correctly when pasted outside this app (e.g. Gmail).
function inlineImageWraps(html) {
  if (!html) return html;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('.img-wrap').forEach(function (wrap) {
    const existing = wrap.getAttribute('style') || '';
    wrap.setAttribute('style', 'display:inline-block;overflow:hidden;border-radius:8px;margin:6px 4px;vertical-align:top;' + existing);
    wrap.removeAttribute('contenteditable');
    wrap.removeAttribute('draggable');
    const img = wrap.querySelector('img');
    if (img) img.setAttribute('style', 'width:100%;height:100%;object-fit:cover;display:block;');
  });
  return tmp.innerHTML;
}

      <div style="padding:${bodyPadding};font-size:14.5px;line-height:1.85;color:#2A2E36;">${inlineImageWraps(page.html)}</div>${footerHtml}
    </div>`;
  }).join('');
}

const EBOOK_JS = `
var idx = 0;
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function renderPage(){
  var p = PAGES[idx];
  var pageEl = document.getElementById('bkPage');
  pageEl.classList.toggle('cover', idx === 0);
  var headerHtml = idx === 0 ? '' : ('<div class="book-page-header"><span class="book-page-badge">หน้า ' + (idx+1) + '/' + PAGES.length + '</span><h1>' + esc(p.title) + '</h1></div>');
  pageEl.innerHTML = headerHtml + '<div class="book-page-body">' + (p.html || '') + '</div>';
  document.getElementById('bkCounter').textContent = 'หน้า ' + (idx+1) + ' จาก ' + PAGES.length;
  document.getElementById('bkPrev').disabled = (idx === 0);
  document.getElementById('bkNext').disabled = (idx === PAGES.length - 1);
  renderDots();
}
function renderDots(){
  var dotsEl = document.getElementById('bkDots');
  dotsEl.innerHTML = '';
  PAGES.forEach(function(p, i){
    var d = document.createElement('button');
    d.className = 'book-dot' + (i === idx ? ' active' : '');
    d.setAttribute('aria-label', 'ไปหน้า ' + (i+1));
    d.onclick = function(){ goTo(i); };
    dotsEl.appendChild(d);
  });
}
function goTo(newIdx){
  if(newIdx === idx || newIdx < 0 || newIdx > PAGES.length - 1) return;
  var dir = newIdx > idx ? 'next' : 'prev';
  var pageEl = document.getElementById('bkPage');
  pageEl.classList.add(dir === 'next' ? 'turn-out-next' : 'turn-out-prev');
  setTimeout(function(){
    idx = newIdx;
    renderPage();
    pageEl.classList.remove('turn-out-next','turn-out-prev');
  }, 380);
}
document.getElementById('bkPrev').addEventListener('click', function(){ goTo(idx - 1); });
document.getElementById('bkNext').addEventListener('click', function(){ goTo(idx + 1); });
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') goTo(idx + 1);
  if(e.key === 'ArrowLeft') goTo(idx - 1);
});
renderPage();
`;

function buildEbookHTML() {
  saveActivePageContent();
  const pages = manualPages.map(p => ({ title: p.title || '', html: p.html || '' }));
  const pagesJSON = JSON.stringify(pages).replace(/<\/script/gi, '<\\/script');
  const chevronLeft = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const chevronRight = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  return '<!DOCTYPE html>\n'
    + '<html lang="th">\n'
    + '<head>\n'
    + '<meta charset="UTF-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>คู่มือการใช้งาน — Easy CRM</title>\n'

    + '  <div class="book-frame"><div class="book-page" id="bkPage"></div></div>\n'
    + '  <button class="book-nav" id="bkNext" aria-label="หน้าถัดไป">' + chevronRight + '</button>\n'
    + '</div>\n'

    + '  <div class="book-dots" id="bkDots"></div>\n'
    + '  <div class="book-counter" id="bkCounter"></div>\n'

    + EBOOK_JS

}

function previewEbook() {
  const html = buildEbookHTML();
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function copyManual() {
  const html = buildManualFullHTML();
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const text = tmp.innerText;
  const statusEl = document.getElementById('manualStatus');

  try {
    const item = new ClipboardItem({
      'text/html': new Blob([html], {type: 'text/html'}),
      'text/plain': new Blob([text], {type: 'text/plain'})
    });
    await navigator.clipboard.write([item]);
    statusEl.style.color = '#1a8a4a';
    statusEl.textContent = '✓ คัดลอกแล้ว ไปวางได้เลย';
    return;
  } catch (err) {
    try {
      document.body.appendChild(tmp);
      const range = document.createRange();
      range.selectNodeContents(tmp);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand('copy');
      sel.removeAllRanges();
      document.body.removeChild(tmp);
      if (ok) {
        statusEl.style.color = '#1a8a4a';
        statusEl.textContent = '✓ คัดลอกแล้ว ไปวางได้เลย';
        return;
      }
      throw new Error('execCommand failed');
    } catch (err2) {
      statusEl.style.color = '#c0392b';
      statusEl.textContent = 'คัดลอกอัตโนมัติไม่สำเร็จ ลองดาวน์โหลดไฟล์แทน';
    }
  }
}

function downloadManual() {
  const fullHtml = buildEbookHTML();
  const blob = new Blob([fullHtml], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'คู่มือการใช้งาน_ebook.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function initManualEditor() {
  document.getElementById('pageTitleInput').value = manualPages[0].title;
  const editorEl = document.getElementById('editor');
  editorEl.innerHTML = manualPages[0].html;
  editorEl.dataset.hint = manualPages[0].hint || DEFAULT_HINT;
  renderPageList();
  updatePageNumBadge();
  try { document.execCommand('enableObjectResizing', false); } catch (e) {}
  initImageDragMove();
}

function switchTool(tool) {
  document.querySelectorAll('.tool-section').forEach(function (section) {
    section.classList.toggle('active', section.id === 'tool-' + tool);
  });
}

render();
initManualEditor();
